[project]
name = "fsspec-alt-strategies-impl"
dynamic = ["version", "readme"]
description = "Alternative, filesystem-independent strategies for fsspec: streaming tree operations, monitors, adaptive files and a router"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Tsuyoshi SUGIBUCHI", email = "sugibuchi@gmail.com" }
]
keywords = [
    "fsspec",
    "filesystem",
    "async",
    "glob",
    "hierarchical namespace",
    "azure data lake",
    "object storage",
    "s3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "fsspec>=2024.2.0",
    "fsspec-alt-strategies>=0.1,<1",
]

[project.optional-dependencies]
# The command line, copying the strategies into another package.
cli = ["click>=8.1"]

[project.scripts]
fsspec-alt-strategies-impl = "fsspec_alt_strategies_impl_cli:main"

[project.urls]
Homepage = "https://github.com/sugibuchi/fsspec-alt-strategies"
Documentation = "https://github.com/sugibuchi/fsspec-alt-strategies/blob/main/USAGE.md"
Source = "https://github.com/sugibuchi/fsspec-alt-strategies"
Issues = "https://github.com/sugibuchi/fsspec-alt-strategies/issues"
Changelog = "https://github.com/sugibuchi/fsspec-alt-strategies/releases"

[tool.uv.sources]
fsspec-alt-strategies = { workspace = true }

# The readme is the workspace's README.md, read by hatch_build.py, and copied
# into the sdist, which a wheel may be built from.
[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.sdist.force-include]
"../../README.md" = "README.md"

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# The git repository is the workspace's, two directories up.
raw-options = { root = "../..", version_scheme = "post-release" }

# The version is written into the package, not read from the installed
# distribution's metadata: a copy of the modules in another package keeps the
# version it was copied at.
[tool.hatch.build.hooks.vcs]
version-file = "src/fsspec_alt_strategies_impl/_version.py"
template = '''
# SPDX-FileCopyrightText: 2026 Tsuyoshi SUGIBUCHI
# SPDX-License-Identifier: Apache-2.0
"""The version of the package, written when it is built."""

__version__ = "{version}"
'''

[tool.hatch.build.targets.wheel]
# The simulated filesystem and the command line are packages of their own, so
# that copies of the strategies leave them out.
packages = [
    "src/fsspec_alt_strategies_impl",
    "src/fsspec_alt_strategies_impl_testing",
    "src/fsspec_alt_strategies_impl_cli",
]

[tool.uv]
# Rebuild the package when its git commit or tags change, as its version
# comes from git (hatch-vcs), not only when pyproject.toml changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "../../README.md" },
    { git = { commit = true, tags = true } },
]
