[project]
name = "fsspec-alt-strategies-impl"
dynamic = ["version"]
description = "Alternative, filesystem-independent strategies for fsspec: tree operations, glob and file buffering"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tsuyoshi SUGIBUCHI" }]
keywords = [
    "fsspec",
    "filesystem",
    "async",
    "glob",
    "hierarchical namespace",
    "azure data lake",
    "databricks",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "fsspec>=2024.2.0",
    "fsspec-alt-strategies",
]

[project.urls]
Homepage = "https://github.com/sugibuchi/fsspec-alt-strategies"
Source = "https://github.com/sugibuchi/fsspec-alt-strategies"
Issues = "https://github.com/sugibuchi/fsspec-alt-strategies/issues"
Changelog = "https://github.com/sugibuchi/fsspec-alt-strategies/releases"

[tool.uv.sources]
fsspec-alt-strategies = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# The git repository is the workspace's, two folders up.
raw-options = { root = "../..", version_scheme = "post-release" }

# The version is written into the package, not read from the installed
# distribution's metadata: a copy of the modules in another package keeps the
# version it was copied at.
[tool.hatch.build.hooks.vcs]
version-file = "src/fsspec_alt_strategies_impl/_version.py"
template = '''
# SPDX-FileCopyrightText: 2026 Tsuyoshi SUGIBUCHI
# SPDX-License-Identifier: Apache-2.0
"""The version of the package, written when it is built."""

__version__ = "{version}"
'''

[tool.hatch.build.targets.wheel]
# The simulated filesystem is a package of its own, so that copies of the
# strategies leave it out.
packages = ["src/fsspec_alt_strategies_impl", "src/fsspec_alt_strategies_impl_testing"]

[tool.uv]
# Rebuild the package when its git commit or tags change, as its version
# comes from git (hatch-vcs), not only when pyproject.toml changes.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]
