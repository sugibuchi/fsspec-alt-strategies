# The workspace: two packages, built and published on their own, developed and
# tested together here.
#
# - packages/common, fsspec-alt-strategies: the interface the strategies
#   share with their callers, installed as a package.
# - packages/impl, fsspec-alt-strategies-impl: the strategies, meant to be copied
#   into a project, and the simulated filesystem their tests use.

[tool.uv.workspace]
members = ["packages/common", "packages/impl"]

[tool.uv.sources]
fsspec-alt-strategies-impl = { workspace = true }
fsspec-alt-strategies = { workspace = true }

[dependency-groups]
dev = [
    "fsspec-alt-strategies-impl",
    "fsspec-alt-strategies",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/common/tests", "packages/impl/tests"]
# Test folders have no __init__.py, and share file names, e.g. tree/test_find.py
# and flat/test_find.py: importlib imports each by its path.
addopts = ["--import-mode=importlib"]
# The library is async first: async tests need no marker.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = [
    "packages/common/src/fsspec_alt_strategies",
    "packages/impl/src/fsspec_alt_strategies_impl",
    "packages/impl/src/fsspec_alt_strategies_impl_testing",
]

[tool.ruff]
exclude = [
    ".tox",
    "build",
]
line-length = 88
# The packages' own modules, first-party in either package.
src = ["packages/common/src", "packages/impl/src"]

[tool.ruff.format]
# Keep hand-written code examples in the documentation as they are.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C",
    "G",
    "E",
    "F",
    "FURB",
    "I",
    "LOG",
    "PERF",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PIE",
    "PYI",
    "RUF",
    "SIM",
    "SLOT",
    "TC",
    "UP",
]
ignore = [
    "E501",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "SIM117",
]
