[project]
name = "fsspec-alt-strategies"
dynamic = ["version"]
description = "Alternative, filesystem-independent strategies for fsspec: tree operations, glob and file buffering"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tsuyoshi SUGIBUCHI" }]
keywords = [
    "fsspec",
    "filesystem",
    "async",
    "glob",
    "hierarchical namespace",
    "azure data lake",
    "databricks",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "fsspec>=2024.2.0",
]

[project.urls]
Homepage = "https://github.com/sugibuchi/fsspec-alt-strategies"
Source = "https://github.com/sugibuchi/fsspec-alt-strategies"
Issues = "https://github.com/sugibuchi/fsspec-alt-strategies/issues"
Changelog = "https://github.com/sugibuchi/fsspec-alt-strategies/releases"

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { 'version_scheme' = 'post-release' }

# The version is written into the package, not read from the installed
# distribution's metadata: a copy of the modules in another package keeps the
# version it was copied at.
[tool.hatch.build.hooks.vcs]
version-file = "src/fsspec_alt_strategies/_version.py"
template = '''
# SPDX-FileCopyrightText: 2026 Tsuyoshi SUGIBUCHI
# SPDX-License-Identifier: Apache-2.0
"""The version of the package, written when it is built."""

__version__ = "{version}"
'''

[tool.hatch.build.targets.wheel]
packages = ["src/fsspec_alt_strategies"]

[tool.hatch.build.targets.sdist]
# Files for development only.
exclude = [
    ".github",
    ".pre-commit-config.yaml",
    "CLAUDE.md",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# Rebuild the project when its git commit or tags change, as its version
# comes from git (hatch-vcs), not only when pyproject.toml changes.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The library is async first: async tests need no marker.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/fsspec_alt_strategies"]

[tool.ruff]
exclude = [
    ".tox",
    "build",
]
line-length = 88

[tool.ruff.format]
# Keep hand-written code examples in the documentation as they are.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C",
    "G",
    "E",
    "F",
    "FURB",
    "I",
    "LOG",
    "PERF",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PIE",
    "PYI",
    "RUF",
    "SIM",
    "SLOT",
    "TC",
    "UP",
]
ignore = [
    "E501",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "SIM117",
]
