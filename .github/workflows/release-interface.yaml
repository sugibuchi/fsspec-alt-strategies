# Release, part 1: on a version tag (e.g. `git push origin v0.1.0`), build the
# interface, fsspec-alt-strategies from packages/common, create the GitHub
# release with it, and publish it to PyPI. When this succeeds,
# release-impl.yaml releases the strategies, which depend on it.
#
# PyPI publishing uses trusted publishing (no token): the PyPI project
# fsspec-alt-strategies needs a trusted publisher for this repository,
# workflow `release-interface.yaml` and environment `pypi` (see
# DEVELOPMENT.md). A workflow publishes one project: PyPI refuses one workflow
# for several.
name: Release interface

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no job pushes: the token is not left in .git/config
          fetch-depth: 0  # the version comes from the git tags (hatch-vcs)

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.22"  # not the latest uv: the same in every run

      - name: Build the package
        run: uv build --package fsspec-alt-strategies --out-dir dist

      - name: Check the package
        run: |
          uv run --no-project python - <<'EOF'
          import glob, os, sys

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          files = sorted(os.path.basename(f) for f in glob.glob("dist/*"))
          print("\n".join(files))
          expected = [
              f"fsspec_alt_strategies-{version}-py3-none-any.whl",
              f"fsspec_alt_strategies-{version}.tar.gz",
          ]
          if files != expected:
              sys.exit(f"expected {expected} for tag {version}")
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-interface
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-interface
          path: dist/

      # The strategies' files are added by release-impl.yaml.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fsspec-alt-strategies/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-interface
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
