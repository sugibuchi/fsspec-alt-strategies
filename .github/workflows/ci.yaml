# Lint the code and the workflows, and test with coverage, on every push to
# main and pull request. The coverage is uploaded to Codecov from one Python
# version: uploading needs the repository secret CODECOV_TOKEN, from the
# repository's settings on codecov.io.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no job pushes: the token is not left in .git/config

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.22"  # not the latest uv: the same in every run

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

      # The workflows: their security (zizmor) and their syntax (actionlint).
      - name: Workflow check
        run: |
          uvx zizmor --offline .github/workflows
          uvx --from actionlint-py actionlint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no job pushes: the token is not left in .git/config
          fetch-depth: 0  # the version comes from the git tags (hatch-vcs)

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.22"  # not the latest uv: the same in every run
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync

      - name: Test with coverage
        run: uv run --no-sync pytest --cov --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.14' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
